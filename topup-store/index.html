<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusTopup - Premium Game Topup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="glass-header">
        <div class="container header-container">
            <div class="logo">
                <i class="ph-fill ph-game-controller"></i>
                <h1>Nexus<span>Topup</span></h1>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Hero Carousel Section -->
        <section class="carousel-container">
            <div class="carousel-track" id="carouselTrack">
                <!-- Slides will be injected by JS -->
            </div>
            <button class="carousel-btn prev" id="prevBtn"><i class="ph-bold ph-caret-left"></i></button>
            <button class="carousel-btn next" id="nextBtn"><i class="ph-bold ph-caret-right"></i></button>
            <div class="carousel-indicators" id="carouselIndicators"></div>
        </section>

        <!-- Game Selection Section -->
        <section class="games-section">
            <div class="section-title">
                <h2>Pilih Game Favoritmu</h2>
                <p>Topup cepat, murah, dan terpercaya 24/7</p>
            </div>
            <div class="game-grid" id="gameGrid">
                <!-- Game cards will be injected by JS -->
            </div>
        </section>
    </main>

    <!-- Price List Modal -->
    <div class="modal-backdrop" id="priceModal">
        <div class="modal-content glass-panel">
            <button class="close-modal" id="closeModalBtn"><i class="ph-bold ph-x"></i></button>
            
            <div class="modal-header">
                <div class="modal-game-info">
                    <img id="modalGameIcon" src="" alt="Game Icon">
                    <div>
                        <h3 id="modalGameTitle">Game Title</h3>
                        <p id="modalGamePublisher">Publisher</p>
                    </div>
                </div>
            </div>

            <div class="pricelist-section">
                <h4>Pilih Nominal Topup</h4>
                <div class="pricelist-grid" id="pricelistGrid">
                    <!-- Price cards will be injected by JS -->
                </div>
            </div>
            
            <!-- WhatsApp Order Summary (Hidden until selected) -->
            <div class="order-summary" id="orderSummary" style="display: none;">
                <div class="summary-details">
                    <span id="summaryItem">100 Diamonds</span>
                    <span id="summaryPrice" class="price">Rp 15.000</span>
                </div>
                <button class="btn-whatsapp" id="btnWhatsapp">
                    <i class="ph-fill ph-whatsapp-logo"></i>
                    Pesan via WhatsApp
                </button>
            </div>

        </div>
    </div>

    <footer>
        <p>&copy; 2026 NexusTopup. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
